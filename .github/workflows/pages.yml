name: Publish Isbild
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh_data:
        description: 'Fetch new SHL match events before publishing'
        type: boolean
        default: true
  schedule:
    # 00:23 Sweden summer time, 23:23 winter time. Public standard runner.
    - cron: '23 22 * * *'
permissions:
  contents: read
concurrency:
  group: isbild-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global pnpm@11.25.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Refresh SHL snapshot
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_data)
        run: pnpm sync:shl
      - name: Validate analysis
        run: pnpm test
      - name: Build static site
        run: pnpm build
      - name: Keep validated match data in repository
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_data)
        run: |
          git add data/shl-2026.json public/data/shl-2026.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update verified SHL match data'
            git push
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
          retention-days: 1
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish on GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
