name: Publish Isbild
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh_data:
        description: 'Fetch new SHL and Hockeyallsvenskan match events before publishing'
        type: boolean
        default: true
      retrain_model:
        description: 'Evaluate larger historical xG model and build goalie history'
        type: boolean
        default: false
  schedule:
    # After match nights in both leagues, in Swedish local time including DST.
    - cron: '0 22 * * *'
      timezone: 'Europe/Stockholm'
    # Daily fallback for late games, rescheduled games and source updates.
    - cron: '23 0 * * *'
      timezone: 'Europe/Stockholm'
permissions:
  contents: read
concurrency:
  group: isbild-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global pnpm@11.25.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v6
        if: github.event_name == 'workflow_dispatch' && inputs.retrain_model
        with:
          python-version: '3.12'
      - name: Evaluate historical model and goalkeepers
        if: github.event_name == 'workflow_dispatch' && inputs.retrain_model
        run: |
          pip install numpy scikit-learn
          python scripts/fetch-shl.py
          node scripts/prepare-training.mjs
          python scripts/train-xg.py
          node scripts/prepare-history.mjs
      - name: Refresh SHL snapshot
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.refresh_data || inputs.retrain_model))
        run: pnpm sync:shl
      - name: Refresh Hockeyallsvenskan snapshot
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.refresh_data || inputs.retrain_model))
        run: pnpm sync:ha
      - name: Refresh official powerplay and boxplay
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.refresh_data || inputs.retrain_model))
        run: pnpm sync:special-teams
      - name: Validate analysis
        run: pnpm test
      - name: Build static site
        run: pnpm build
      - name: Keep validated match data in repository
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.refresh_data || inputs.retrain_model))
        run: |
          git add data/ha-2026.json public/data/ha-2026.json data/shl-2026.json public/data/shl-2026.json data/xg-model.json data/model-evaluation.json data/goalie-history.json data/special-teams.json public/data/special-teams.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update verified hockey match data'
            git push
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
          retention-days: 1
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish on GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
